version: 2
project_name: airan

builds:
  - main: ./cmd/airan/
    binary: airan
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - freebsd
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "6"
    # Keep exactly the platform set the previous hand-rolled matrix
    # shipped — install.sh maps uname to these names.
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: freebsd
        goarch: arm64
      - goos: freebsd
        goarch: arm
      - goos: windows
        goarch: arm

archives:
  # Raw binaries, not tarballs: install.sh downloads the asset directly.
  - formats: [binary]
    name_template: "airan-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: LICENSE

release:
  github:
    owner: kfet
    name: airan
  prerelease: auto
  name_template: "airan {{.Version}}"
  extra_files:
    - glob: LICENSE

# ---------------------------------------------------------------------------
# Homebrew tap
#
# GoReleaser regenerates Formula/airan.rb on kfet/homebrew-ai on every
# release (the shared tap for fir, poe-acp, slack-acp).
#
# Users install with:
#   brew install kfet/ai/airan
# ---------------------------------------------------------------------------
brews:
  - name: airan
    # Pushed over ssh with a WRITE deploy key on kfet/homebrew-ai,
    # rather than with a personal access token. A deploy key is scoped
    # to exactly one repository and does not expire, where a
    # fine-grained PAT is account-wide, opaque once created, and
    # capped at a one-year lifetime — i.e. it breaks silently, later.
    # Each consumer repo has its OWN key, so one can be revoked
    # without touching the others.
    #
    # private_key takes the key CONTENTS (GoReleaser writes them to a
    # temp file itself), not a path.
    repository:
      owner: kfet
      name: homebrew-ai
      branch: main
      git:
        url: 'git@github.com:kfet/homebrew-ai.git'
        private_key: '{{ index .Env "HOMEBREW_TAP_SSH_KEY" }}'
    directory: Formula
    url_template: "https://github.com/kfet/airan/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: "https://github.com/kfet/airan"
    description: "The env for AI coding agents — a shebang dispatcher for agent files"
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "airan: update to {{ .Tag }}"
    # Skip the tap push when no key is configured, instead of failing
    # the whole release. A fresh clone or a fork has no
    # HOMEBREW_TAP_SSH_KEY, and a missing formula update is not a
    # reason to withhold the binaries. "auto" additionally skips
    # prereleases.
    #
    # index .Env rather than .Env.X so an entirely unset variable is an
    # empty string instead of a template error.
    skip_upload: '{{ if eq (index .Env "HOMEBREW_TAP_SSH_KEY") "" }}true{{ else }}auto{{ end }}'
    test: |
      system "#{bin}/airan", "version"
    # The downloaded artifact is named airan-<os>-<arch> (archives.formats=binary
    # emits raw binaries, not tarballs), so `bin.install "airan"` fails with
    # ENOENT. Glob the staged artifact and rename it on install.
    install: |
      bin.install Dir["airan-*"].first => "airan"

changelog:
  use: github-native
