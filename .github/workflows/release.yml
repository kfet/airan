name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Guard release version
        uses: kfet/gha/release-guard@4c729c719a3c76fbfa85c26722f0bd1ab63216ba

      - name: Build and test
        run: make all

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # May be unset: .goreleaser.yaml skips the tap push rather than
          # failing the release when it is empty. This is an ssh private
          # key for a WRITE deploy key on kfet/homebrew-ai, not a PAT —
          # repo-scoped and non-expiring, and unique to this repo.
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
